
services:
  postgres:
    image: postgres:16-alpine
    container_name: tagin_postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
 
  redis:
    image: redis:7-alpine
    container_name: tagin_redis
    ports:
      - "6379:6379"
 
  ytdlp:
    build: .
    container_name: tagin_ytdlp
    volumes:
      - ./downloads:/downloads
 
volumes:
  postgres_data:
 